name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: posterapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/posterapp"
      CLERK_SECRET_KEY: "sk_test_mock_mock_mock_mock_mock_mock_mock_mock_mock"
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_test_mock_mock_mock_mock_mock_mock_mock_mock_mock"
      NEXT_PUBLIC_E2E_TEST: "1"
      NEXT_PUBLIC_YJS_WS_URL: "ws://localhost:3333/api/yjs"
      AI_API_URL: "https://openrouter.ai/api/v1"
      AI_API_KEY: "mock-key"
      AI_MODEL: "gemini-3-flash"

    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Push Prisma Database Schema
        run: pnpm exec prisma db push
      - name: Check typing
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Test (Unit)
        run: pnpm test -- --run
      - name: Build
        run: pnpm build

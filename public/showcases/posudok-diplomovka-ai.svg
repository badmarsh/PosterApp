<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1754" viewBox="0 0 1240 1754" role="img" aria-label="Posudok diplomovej práce — náhľad"><rect width="1240" height="1754" fill="#ffffff"/><text x="92" y="114" font-family="DejaVu Serif, serif" font-size="25" fill="#111827" font-weight="bold">Univerzita Komenského v Bratislave</text><text x="92" y="140" font-family="DejaVu Serif, serif" font-size="17" fill="#1f2937">Fakulta matematiky, fyziky a informatiky</text><text x="1148" y="110" font-family="DejaVu Serif, serif" font-size="14" fill="#6b7280" text-anchor="end">doc. RNDr. Róbert Astaloš, PhD.</text><text x="1148" y="130" font-family="DejaVu Serif, serif" font-size="14" fill="#6b7280" text-anchor="end">Katedra jadrovej fyziky a biofyziky</text><text x="1148" y="150" font-family="DejaVu Serif, serif" font-size="14" fill="#6b7280" text-anchor="end">V Bratislave, 21. mája 2026</text><rect x="92" y="166" width="1056" height="5" fill="#1B3A6B"/><rect x="92" y="176" width="1056" height="1.4" fill="#1B3A6B"/><text x="620" y="244" font-family="DejaVu Serif, serif" font-size="31" fill="#111827" font-weight="bold" text-anchor="middle">POSUDOK ZÁVEREČNEJ PRÁCE</text><rect x="370" y="264" width="500" height="2.6" fill="#1B3A6B"/><rect x="450" y="274" width="340" height="1.2" fill="#1B3A6B"/><text x="92" y="328" font-family="DejaVu Serif, serif" font-size="17" fill="#1B3A6B" font-weight="bold">IDENTIFIKAČNÉ ÚDAJE PRÁCE</text><rect x="92" y="337" width="1056" height="1.6" fill="#c7d2df"/><text x="92" y="368" font-family="DejaVu Serif, serif" font-size="14.5" fill="#111827" font-weight="bold">Autor práce:</text><text x="392" y="368" font-family="DejaVu Serif, serif" font-size="14.5" fill="#1f2937">Bc. Martin Kováč</text><text x="92" y="396" font-family="DejaVu Serif, serif" font-size="14.5" fill="#111827" font-weight="bold">Názov diplomovej práce:</text><text x="392" y="396" font-family="DejaVu Serif, serif" font-size="14.5" fill="#1f2937">Sémantická segmentácia pľúcnych lézií hlbokými reziduálnymi sieťami</text><text x="92" y="424" font-family="DejaVu Serif, serif" font-size="14.5" fill="#111827" font-weight="bold">Typ práce:</text><text x="392" y="424" font-family="DejaVu Serif, serif" font-size="14.5" fill="#1f2937">Diplomová práca · Aplikovaná informatika a biofyzika · 2025/2026</text><text x="92" y="452" font-family="DejaVu Serif, serif" font-size="14.5" fill="#111827" font-weight="bold">Vypracoval/a:</text><text x="392" y="452" font-family="DejaVu Serif, serif" font-size="14.5" fill="#1f2937">doc. RNDr. Róbert Astaloš, PhD. (vedúci práce)</text><text x="92" y="506" font-family="DejaVu Serif, serif" font-size="15.5" fill="#111827" font-weight="bold">1. Zhrnutie práce a hlavný prínos (Executive Summary)</text><rect x="92" y="514" width="1056" height="1" fill="#1B3A6B"/><text x="92" y="538" font-family="DejaVu Serif, serif" font-size="13.5" fill="#1f2937">Práca rieši sémantickú segmentáciu pľúcnych lézií z CT skenov pomocou hlbokých reziduálnych sietí. Autor</text><text x="92" y="557" font-family="DejaVu Serif, serif" font-size="13.5" fill="#1f2937">navrhol modifikovanú ResNet/U-Net architektúru s hybridnou dice-loss funkciou a attention-gated prepojeniami</text><text x="92" y="576" font-family="DejaVu Serif, serif" font-size="13.5" fill="#1f2937">a dôsledne ju validoval na verejnom referenčnom korpuse LIDC-IDRI.</text><text x="92" y="613" font-family="DejaVu Serif, serif" font-size="15.5" fill="#111827" font-weight="bold">2. Silné stránky práce (Key Strengths)</text><rect x="92" y="621" width="1056" height="1" fill="#1B3A6B"/><circle cx="96" cy="638" r="2.4" fill="#1B3A6B"/><text x="110" y="643" font-family="DejaVu Serif, serif" font-size="13.5" fill="#1f2937">Samostatnosť a iniciatíva: študent si sám dohodol spoluprácu s klinickým pracoviskom a zabezpečil anotácie</text><text x="110" y="662" font-family="DejaVu Serif, serif" font-size="13.5" fill="#1f2937">pre validačnú množinu.</text><circle cx="96" cy="682" r="2.4" fill="#1B3A6B"/><text x="110" y="687" font-family="DejaVu Serif, serif" font-size="13.5" fill="#1f2937">Reprodukovateľnosť: kód, konfigurácie aj predtrénované váhy sú zverejnené s návodom na reprodukciu všetkých</text><text x="110" y="706" font-family="DejaVu Serif, serif" font-size="13.5" fill="#1f2937">tabuliek.</text><circle cx="96" cy="726" r="2.4" fill="#1B3A6B"/><text x="110" y="731" font-family="DejaVu Serif, serif" font-size="13.5" fill="#1f2937">Klinická relevancia: metóda je validovaná spôsobom, ktorý zodpovedá reálnemu diagnostickému postupu.</text><text x="92" y="772" font-family="DejaVu Serif, serif" font-size="15.5" fill="#111827" font-weight="bold">3. PREHĽAD HODNOTENIA KRITÉRIÍ</text><rect x="92" y="780" width="1056" height="1.6" fill="#c7d2df"/><text x="92" y="806" font-family="DejaVu Serif, serif" font-size="14" fill="#111827" font-weight="bold">Kritérium</text><text x="916" y="806" font-family="DejaVu Serif, serif" font-size="14" fill="#111827" font-weight="bold" text-anchor="middle">Váha</text><text x="1010" y="806" font-family="DejaVu Serif, serif" font-size="14" fill="#111827" font-weight="bold" text-anchor="middle">Body</text><text x="1148" y="806" font-family="DejaVu Serif, serif" font-size="14" fill="#111827" font-weight="bold" text-anchor="end">Hodnotenie</text><rect x="92" y="816" width="1056" height="1.6" fill="#1B3A6B"/><text x="92" y="842" font-family="DejaVu Serif, serif" font-size="13.5" fill="#1f2937">Splnenie stanovených cieľov a náročnosť zadania</text><text x="916" y="842" font-family="DejaVu Serif, serif" font-size="14" fill="#1f2937" text-anchor="middle">5 %</text><text x="1010" y="842" font-family="DejaVu Serif, serif" font-size="14" fill="#1f2937" text-anchor="middle">95</text><rect x="1114" y="825" width="34" height="34" fill="none" stroke="#111827" stroke-width="1.4"/><text x="1131" y="848" font-family="DejaVu Serif, serif" font-size="17" fill="#111827" font-weight="bold" text-anchor="middle">A</text><text x="92" y="868" font-family="DejaVu Serif, serif" font-size="13.5" fill="#1f2937">Odborná úroveň a teoretická báza</text><text x="916" y="868" font-family="DejaVu Serif, serif" font-size="14" fill="#1f2937" text-anchor="middle">15 %</text><text x="1010" y="868" font-family="DejaVu Serif, serif" font-size="14" fill="#1f2937" text-anchor="middle">95</text><rect x="1114" y="851" width="34" height="34" fill="none" stroke="#111827" stroke-width="1.4"/><text x="1131" y="874" font-family="DejaVu Serif, serif" font-size="17" fill="#111827" font-weight="bold" text-anchor="middle">A</text><text x="92" y="894" font-family="DejaVu Serif, serif" font-size="13.5" fill="#1f2937">Metodologická primeranosť a postup riešenia</text><text x="916" y="894" font-family="DejaVu Serif, serif" font-size="14" fill="#1f2937" text-anchor="middle">15 %</text><text x="1010" y="894" font-family="DejaVu Serif, serif" font-size="14" fill="#1f2937" text-anchor="middle">85</text><rect x="1114" y="877" width="34" height="34" fill="none" stroke="#111827" stroke-width="1.4"/><text x="1131" y="900" font-family="DejaVu Serif, serif" font-size="17" fill="#111827" font-weight="bold" text-anchor="middle">B</text><text x="92" y="920" font-family="DejaVu Serif, serif" font-size="13.5" fill="#1f2937">Validita výsledkov a ich interpretácia</text><text x="916" y="920" font-family="DejaVu Serif, serif" font-size="14" fill="#1f2937" text-anchor="middle">10 %</text><text x="1010" y="920" font-family="DejaVu Serif, serif" font-size="14" fill="#1f2937" text-anchor="middle">95</text><rect x="1114" y="903" width="34" height="34" fill="none" stroke="#111827" stroke-width="1.4"/><text x="1131" y="926" font-family="DejaVu Serif, serif" font-size="17" fill="#111827" font-weight="bold" text-anchor="middle">A</text><text x="92" y="946" font-family="DejaVu Serif, serif" font-size="13.5" fill="#1f2937">Diskusia a nadväznosť na ciele</text><text x="916" y="946" font-family="DejaVu Serif, serif" font-size="14" fill="#1f2937" text-anchor="middle">10 %</text><text x="1010" y="946" font-family="DejaVu Serif, serif" font-size="14" fill="#1f2937" text-anchor="middle">95</text><rect x="1114" y="929" width="34" height="34" fill="none" stroke="#111827" stroke-width="1.4"/><text x="1131" y="952" font-family="DejaVu Serif, serif" font-size="17" fill="#111827" font-weight="bold" text-anchor="middle">A</text><rect x="92" y="966" width="1056" height="1.6" fill="#1B3A6B"/><text x="92" y="996" font-family="DejaVu Serif, serif" font-size="14" fill="#6b7280">Vážený priemer hodnotených kritérií:</text><text x="360" y="996" font-family="DejaVu Serif, serif" font-size="15" fill="#1B3A6B" font-weight="bold">92.3 % (A)</text><text x="492" y="996" font-family="DejaVu Serif, serif" font-size="13.5" fill="#6b7280">· 5 / 5 hodnotených kritérií</text><text x="92" y="1018" font-family="DejaVu Serif, serif" font-size="12.5" fill="#6b7280" font-style="italic">Stupnica: A – výborne · B – veľmi dobre · C – dobre · D – uspokojivo · E – dostatočne · F – nedostatočne</text><text x="92" y="1036" font-family="DejaVu Serif, serif" font-size="15.5" fill="#111827" font-weight="bold">4. HODNOTENIE KRITÉRIÍ</text><rect x="92" y="1044" width="1056" height="1.6" fill="#c7d2df"/><rect x="92" y="1058" width="4" height="20" fill="#1B3A6B"/><text x="106" y="1070" font-family="DejaVu Serif, serif" font-size="14.5" fill="#111827" font-weight="bold">3. Metodologická primeranosť a postup riešenia</text><text x="1148" y="1070" font-family="DejaVu Serif, serif" font-size="14" fill="#111827" font-weight="bold" text-anchor="end">Hodnotenie: B</text><text x="92" y="1096" font-family="DejaVu Serif, serif" font-size="13.5" fill="#1f2937">Experimentálna časť je metodicky solídna; výhrady smerujú k voľbe hyperparametrov. Dataset a protokol:</text><text x="92" y="1115" font-family="DejaVu Serif, serif" font-size="13.5" fill="#1f2937">LIDC-IDRI (1018 pacientov) s 5-násobnou krížovou validáciou. Kvalita implementácie: modulárny PyTorch</text><text x="92" y="1134" font-family="DejaVu Serif, serif" font-size="13.5" fill="#1f2937">repozitár s unit testami a skriptom reprodukujúcim všetky tabuľky.</text><text x="92" y="1175" font-family="DejaVu Serif, serif" font-size="15.5" fill="#111827" font-weight="bold">5. OTÁZKY K OBHAJOBE</text><rect x="92" y="1183" width="1056" height="1.6" fill="#c7d2df"/><text x="92" y="1209" font-family="DejaVu Serif, serif" font-size="13.5" fill="#111827" font-weight="bold">1.</text><text x="118" y="1209" font-family="DejaVu Serif, serif" font-size="13.5" fill="#1f2937">Ako by navrhovaný model reagoval na obrazové artefakty spôsobené pohybom pacienta pri nízko-dávkovom CT?</text><text x="92" y="1236" font-family="DejaVu Serif, serif" font-size="13.5" fill="#111827" font-weight="bold">2.</text><text x="118" y="1236" font-family="DejaVu Serif, serif" font-size="13.5" fill="#1f2937">Aká je výpočtová zložitosť inferencie jedného 3D objemu a je model nasaditeľný v reálnej klinickej</text><text x="118" y="1255" font-family="DejaVu Serif, serif" font-size="13.5" fill="#1f2937">prevádzke?</text><text x="92" y="1292" font-family="DejaVu Serif, serif" font-size="15.5" fill="#111827" font-weight="bold">6. POZNÁMKY K CITÁCIÁM</text><rect x="92" y="1300" width="1056" height="1" fill="#1B3A6B"/><text x="92" y="1318" font-family="DejaVu Serif, serif" font-size="13.5" fill="#1B3A6B">•</text><text x="110" y="1318" font-family="DejaVu Serif, serif" font-size="13.5" fill="#1f2937">Chýbajúce DOI: pri položkách č. 12 a 27 chýba DOI alebo trvalý identifikátor; obe sú dohľadateľné v</text><text x="110" y="1337" font-family="DejaVu Serif, serif" font-size="13.5" fill="#1f2937">Crossref.</text><text x="92" y="1362" font-family="DejaVu Serif, serif" font-size="13.5" fill="#1B3A6B">•</text><text x="110" y="1362" font-family="DejaVu Serif, serif" font-size="13.5" fill="#1f2937">Nekonzistentný štýl: tri položky skracujú názvy konferencií odlišne od zvyšku práce.</text><text x="92" y="1452" font-family="DejaVu Serif, serif" font-size="15.5" fill="#111827" font-weight="bold">7. CELKOVÉ HODNOTENIE</text><rect x="92" y="1460" width="1056" height="1.6" fill="#c7d2df"/><text x="92" y="1496" font-family="DejaVu Serif, serif" font-size="15" fill="#111827">Navrhovaná klasifikácia:</text><rect x="342" y="1474" width="52" height="34" fill="none" stroke="#111827" stroke-width="1.6"/><text x="368" y="1499" font-family="DejaVu Serif, serif" font-size="21" fill="#111827" font-weight="bold" text-anchor="middle">A</text><text x="1148" y="1496" font-family="DejaVu Serif, serif" font-size="14.5" fill="#1f2937" text-anchor="end">ECTS: A · 92.3 % · Výborne</text><text x="92" y="1532" font-family="DejaVu Serif, serif" font-size="14.5" fill="#1f2937">Odporúčanie: Prácu odporúčam k obhajobe pred komisiou pre štátne záverečné skúšky na FMFI UK.</text><rect x="92" y="1604" width="400" height="1" fill="#374151"/><text x="92" y="1624" font-family="DejaVu Serif, serif" font-size="12.5" fill="#6b7280">Podpis hodnotiteľa/ky</text><rect x="828" y="1604" width="320" height="1" fill="#374151"/><text x="828" y="1624" font-family="DejaVu Serif, serif" font-size="12.5" fill="#6b7280">Dátum: 21. mája 2026</text><text x="620" y="1730" font-family="DejaVu Serif, serif" font-size="11.5" fill="#9ca3af" text-anchor="middle">Posudok vedúceho diplomovej práce · PosterApp · vygenerované z hodnotiaceho rámca SK_ACADEMIC_RUBRIC_V1</text></svg>

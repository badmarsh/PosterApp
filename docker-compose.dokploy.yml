version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # Optional self-hosted PostgreSQL + pgvector
  # (Ignored if DATABASE_URL points to Supabase Cloud)
  # ---------------------------------------------------------------------------
  postgres:
    profiles: ["local-db"]
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-posterapp}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-posterapp}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  # ---------------------------------------------------------------------------
  # Database schema sync & migration service
  # Runs 'prisma db push' on startup, then exits (code 0)
  # ---------------------------------------------------------------------------
  db-init:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
        NEXT_PUBLIC_CLERK_SIGN_IN_URL: ${NEXT_PUBLIC_CLERK_SIGN_IN_URL:-/sign-in}
        NEXT_PUBLIC_CLERK_SIGN_UP_URL: ${NEXT_PUBLIC_CLERK_SIGN_UP_URL:-/sign-up}
        NEXT_PUBLIC_YJS_WS_URL: ${NEXT_PUBLIC_YJS_WS_URL}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DIRECT_URL: ${DIRECT_URL}
    command: >
      sh -c "
        echo '==> [1/1] Prisma database schema sync...' &&
        npx prisma db push --skip-generate &&
        echo '==> Database schema is up to date.'
      "
    networks:
      - internal
      - dokploy-network

  # ---------------------------------------------------------------------------
  # PosterApp Web Application & Yjs Collaboration Server
  # Serves Next.js on port 3333 AND WebSocket at /api/yjs
  # ---------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
        NEXT_PUBLIC_CLERK_SIGN_IN_URL: ${NEXT_PUBLIC_CLERK_SIGN_IN_URL:-/sign-in}
        NEXT_PUBLIC_CLERK_SIGN_UP_URL: ${NEXT_PUBLIC_CLERK_SIGN_UP_URL:-/sign-up}
        NEXT_PUBLIC_YJS_WS_URL: ${NEXT_PUBLIC_YJS_WS_URL}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    restart: unless-stopped
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 3333
      HOSTNAME: "0.0.0.0"
      DATABASE_URL: ${DATABASE_URL}
      DIRECT_URL: ${DIRECT_URL}
      # Supabase Cloud Client Keys
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      # Registration Control
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      NEXT_PUBLIC_ALLOW_REGISTRATION: ${NEXT_PUBLIC_ALLOW_REGISTRATION:-true}
      # Clerk Authentication
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: ${NEXT_PUBLIC_CLERK_SIGN_IN_URL:-/sign-in}
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: ${NEXT_PUBLIC_CLERK_SIGN_UP_URL:-/sign-up}
      NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL: ${NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL:-/}
      NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL: ${NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL:-/}
      # Yjs Collaboration WebSocket (wss://domain/api/yjs)
      NEXT_PUBLIC_YJS_WS_URL: ${NEXT_PUBLIC_YJS_WS_URL}
      # OpenRouter & AI Providers (Endpoints configured in Settings -> AI Models)
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      AI_MODEL: ${AI_MODEL:-gemini-3.8-flash}
      AI_API_KEY: ${AI_API_KEY}
      AI_VISION_MODEL: ${AI_VISION_MODEL:-gemini-3.8-flash}
      AI_VISION_FALLBACK_MODELS: ${AI_VISION_FALLBACK_MODELS}
      AI_VISION_API_KEY: ${AI_VISION_API_KEY}
      AI_REVIEW_LAYOUT_MODEL: ${AI_REVIEW_LAYOUT_MODEL:-gemini-3.8-flash}
      AI_AUTOFIX_MODEL: ${AI_AUTOFIX_MODEL:-gemini-3.8-flash}
      # MinerU Document Parsing Sidecar
      MINERU_API_URL: ${MINERU_API_URL:-http://mineru-api-wsl:8000}
      MINERU_API_KEY: ${MINERU_API_KEY}
      # Academic & Research Connectors
      SEMANTIC_SCHOLAR_API_KEY: ${SEMANTIC_SCHOLAR_API_KEY}
      OPENALEX_API_KEY: ${OPENALEX_API_KEY}
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      EXA_API_KEY: ${EXA_API_KEY}
      SERPER_API_KEY: ${SERPER_API_KEY}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY}
      # Storage & Persistence
      WORKSPACES_DIR: workspaces
      YPERSISTENCE: ./tmp/yjs
      CACHE_DIR: /app/.cache
      RATE_LIMIT_ALLOW_IN_MEMORY: ${RATE_LIMIT_ALLOW_IN_MEMORY:-1}
      AUTH_SECRET: ${AUTH_SECRET}
      NEXT_TELEMETRY_DISABLED: 1
    volumes:
      - posterapp_workspaces:/app/workspaces
      - posterapp_yjs:/app/tmp/yjs
      - posterapp_cache:/app/.cache
    networks:
      - internal
      - dokploy-network
    labels:
      - "traefik.enable=true"
      # HTTP -> HTTPS redirect
      - "traefik.http.routers.posterapp-web-http.rule=Host(`${DOMAIN:-poster.dev.significa.sk}`)"
      - "traefik.http.routers.posterapp-web-http.entrypoints=web"
      - "traefik.http.routers.posterapp-web-http.middlewares=redirect-to-https@file"
      - "traefik.http.routers.posterapp-web-http.service=posterapp-web"
      # HTTPS router
      - "traefik.http.routers.posterapp-web.rule=Host(`${DOMAIN:-poster.dev.significa.sk}`)"
      - "traefik.http.routers.posterapp-web.entrypoints=websecure"
      - "traefik.http.routers.posterapp-web.tls=true"
      - "traefik.http.routers.posterapp-web.tls.certresolver=letsencrypt"
      - "traefik.http.routers.posterapp-web.service=posterapp-web"
      # Service loadbalancer
      - "traefik.http.services.posterapp-web.loadbalancer.server.port=3333"

networks:
  internal:
    driver: bridge
  dokploy-network:
    external: true

volumes:
  posterapp_workspaces:
  posterapp_yjs:
  posterapp_cache:
  postgres_data:
